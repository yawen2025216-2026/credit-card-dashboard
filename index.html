<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信用卡回饋查詢儀表板</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .dashboard-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .result-card { border: none; border-left: 6px solid #4c5c92; background-color: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s, box-shadow 0.2s; margin-bottom: 1rem; border-radius: 8px; }
        .result-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.12); }
        .store-title { color: #2c3e50; font-size: 1.4rem; border-bottom: 2px dashed #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .info-label { font-weight: 600; color: #6c757d; margin-bottom: 4px; font-size: 0.9rem; }
        .highlight-value { font-size: 1.15rem; font-weight: bold; }
        .reward-rate { color: #e74c3c; font-size: 1.5rem; font-weight: 900; }
        #loading { display: none; text-align: center; margin-top: 30px; }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2 class="text-center mb-4" style="color: #2c3e50; font-weight: bold;">💳 信用卡回饋快速查詢</h2>
    
    <div class="mb-4">
        <input type="text" class="form-control form-control-lg shadow-sm" id="searchInput" placeholder="請輸入想查詢的店家 (例如：全家、新光、Uber)..." style="border-radius: 10px; border: 1px solid #ced4da;">
    </div>

    <div id="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">載入中...</span>
        </div>
        <p class="mt-2 text-muted">資料同步中...</p>
    </div>

    <div id="resultsContainer">
        <!-- 查詢結果會顯示在這裡 -->
    </div>
</div>

<!-- 引入 PapaParse -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
    // ==========================================
    // ⚠️ 請將下方的網址替換為您的 CSV 網址 ⚠️
    // ==========================================
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS8wj191NVP1LUommlS-QW-S2hLtZBPBZrus7PIR8BeZKVixg1H72yvawwjjLh1ELtOvfS6DbqN_Nbi/pub?output=csv'; 
    let creditCardData = [];

    // 取得並解析 CSV 資料
    function fetchAndParseData() {
        document.getElementById('loading').style.display = 'block';
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                creditCardData = results.data.filter(row => row['店家名稱']); 
                document.getElementById('loading').style.display = 'none';
            },
            error: function(err) {
                document.getElementById('resultsContainer').innerHTML = `<div class="alert alert-danger">資料載入失敗，請確認 CSV 連結是否正確。</div>`;
                document.getElementById('loading').style.display = 'none';
            }
        });
    }

    // 搜尋功能
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const keyword = e.target.value.trim().toLowerCase();
        const resultsContainer = document.getElementById('resultsContainer');
        
        if (keyword === '') {
            resultsContainer.innerHTML = '';
            return;
        }

        const filteredData = creditCardData.filter(item => 
            item['店家名稱'] && item['店家名稱'].toLowerCase().includes(keyword)
        );

        displayResults(filteredData, keyword);
    });

    // 顯示結果
    function displayResults(data, keyword) {
        const resultsContainer = document.getElementById('resultsContainer');
        resultsContainer.innerHTML = '';

        if (data.length === 0) {
            resultsContainer.innerHTML = `<div class="alert alert-warning text-center">找不到包含「${keyword}」的店家資訊。</div>`;
            return;
        }

        data.forEach(item => {
            // 判斷卡片顏色 (國泰綠色、台新紅色)
            let cardBadgeColor = item['信用卡'].includes('CUBE') ? 'bg-success' : (item['信用卡'].includes('GoGo') ? 'bg-danger' : 'bg-primary');
            let schemeInfo = item['權益方案/條件'] ? item['權益方案/條件'] : '無特殊條件';

            const cardHtml = `
                <div class="card result-card">
                    <div class="card-body p-4">
                        <h4 class="store-title">🏪 ${item['店家名稱']}</h4>
                        
                        <div class="row align-items-center">
                            <!-- 刷哪張卡 -->
                            <div class="col-md-4 mb-3 mb-md-0">
                                <div class="info-label">刷這張卡</div>
                                <span class="badge ${cardBadgeColor} fs-6 px-3 py-2 shadow-sm">${item['信用卡']}</span>
                            </div>
                            
                            <!-- 切什麼方案 -->
                            <div class="col-md-5 mb-3 mb-md-0">
                                <div class="info-label">請切換此方案 / 條件</div>
                                <div class="highlight-value text-dark" style="background-color: #fff3cd; padding: 6px 12px; border-radius: 6px; border-left: 4px solid #ffc107; display: inline-block;">
                                    🔄 ${schemeInfo}
                                </div>
                            </div>
                            
                            <!-- 回饋多少 -->
                            <div class="col-md-3 text-md-end text-start">
                                <div class="info-label">最高回饋</div>
                                <div class="reward-rate">${item['回饋比例']}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            resultsContainer.innerHTML += cardHtml;
        });
    }

    window.onload = fetchAndParseData;
</script>

</body>
</html>
