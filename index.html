<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信用卡回饋查詢儀表板</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Font Awesome 為了使用小圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .dashboard-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .result-card { border: none; border-left: 6px solid #4c5c92; background-color: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s, box-shadow 0.2s; margin-bottom: 1rem; border-radius: 8px; }
        .result-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.12); }
        .store-title { color: #2c3e50; font-size: 1.4rem; border-bottom: 2px dashed #eee; padding-bottom: 10px; margin-bottom: 15px; font-weight: bold; }
        .info-label { font-weight: 600; color: #6c757d; margin-bottom: 6px; font-size: 0.9rem; }
        .reward-rate { color: #e74c3c; font-size: 1.8rem; font-weight: 900; }
        #loading { display: none; text-align: center; margin-top: 30px; }
        
        /* 隱藏條件區塊的樣式 */
        .scheme-details {
            display: none;
            background-color: #f8f9fa;
            border-left: 4px solid #ffc107;
            padding: 12px 15px;
            margin-top: 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            color: #495057;
            line-height: 1.6;
        }
        /* 按鈕樣式微調 */
        .btn-toggle-rules {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .scheme-badge {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h2 class="text-center mb-4" style="color: #2c3e50; font-weight: bold;">💳 信用卡回饋快速查詢</h2>
    
    <div class="mb-4">
        <input type="text" class="form-control form-control-lg shadow-sm" id="searchInput" placeholder="請輸入想查詢的店家 (例如：茶六、全家、蝦皮)..." style="border-radius: 10px; border: 1px solid #ced4da;">
    </div>

    <div id="loading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">載入中...</span>
        </div>
        <p class="mt-2 text-muted">資料同步中...</p>
    </div>

    <div id="resultsContainer">
        <!-- 查詢結果會顯示在這裡 -->
    </div>
</div>

<!-- 引入 PapaParse -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
    // ==========================================
    // ⚠️ 請將下方的網址替換為您的 CSV 網址 ⚠️
    // ==========================================
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS8wj191NVP1LUommlS-QW-S2hLtZBPBZrus7PIR8BeZKVixg1H72yvawwjjLh1ELtOvfS6DbqN_Nbi/pub?output=csv'; 
    let creditCardData = [];

    function fetchAndParseData() {
        document.getElementById('loading').style.display = 'block';
        Papa.parse(csvUrl, {
            download: true,
            header: true,
            complete: function(results) {
                creditCardData = results.data.filter(row => row['店家名稱']); 
                document.getElementById('loading').style.display = 'none';
            },
            error: function(err) {
                document.getElementById('resultsContainer').innerHTML = `<div class="alert alert-danger">資料載入失敗，請確認 CSV 連結是否正確。</div>`;
                document.getElementById('loading').style.display = 'none';
            }
        });
    }

    document.getElementById('searchInput').addEventListener('input', function(e) {
        const keyword = e.target.value.trim().toLowerCase();
        const resultsContainer = document.getElementById('resultsContainer');
        
        if (keyword === '') {
            resultsContainer.innerHTML = '';
            return;
        }

        const filteredData = creditCardData.filter(item => 
            item['店家名稱'] && item['店家名稱'].toLowerCase().includes(keyword)
        );

        displayResults(filteredData, keyword);
    });

    function toggleDetails(buttonId, detailsId) {
        const detailsDiv = document.getElementById(detailsId);
        const button = document.getElementById(buttonId);
        
        if (detailsDiv.style.display === "none" || detailsDiv.style.display === "") {
            detailsDiv.style.display = "block";
            button.innerHTML = '<i class="fas fa-chevron-up me-1"></i> 收起權益規則';
            button.classList.remove('btn-outline-secondary');
            button.classList.add('btn-secondary');
        } else {
            detailsDiv.style.display = "none";
            button.innerHTML = '<i class="fas fa-info-circle me-1"></i> 點我看注意事項';
            button.classList.remove('btn-secondary');
            button.classList.add('btn-outline-secondary');
        }
    }

    function displayResults(data, keyword) {
        const resultsContainer = document.getElementById('resultsContainer');
        resultsContainer.innerHTML = '';

        if (data.length === 0) {
            resultsContainer.innerHTML = `<div class="alert alert-warning text-center">找不到包含「${keyword}」的店家資訊。</div>`;
            return;
        }

        data.forEach((item, index) => {
            // 判斷卡片顏色
            let cardBadgeColor = item['信用卡'].includes('CUBE') ? 'bg-success' : (item['信用卡'].includes('GoGo') || item['信用卡'].includes('Richart') ? 'bg-danger' : 'bg-primary');
            let rawSchemeInfo = item['權益方案/條件'] ? item['權益方案/條件'] : '無特殊條件';
            
            // 自動萃取短版「切換方案名稱」(抓取第一行且不含括號的內容)
            let shortScheme = "預設免切換";
            if (rawSchemeInfo && rawSchemeInfo !== '無特殊條件') {
                let firstLine = rawSchemeInfo.split('\n')[0].replace(/<br>/g, '');
                shortScheme = firstLine.split(/[(（\-:]/)[0].trim();
                if(shortScheme.length > 15) shortScheme = shortScheme.substring(0, 15) + '...';
            }
            
            const detailsId = `details-${index}`;
            const buttonId = `btn-${index}`;

            const cardHtml = `
                <div class="card result-card">
                    <div class="card-body p-4">
                        <h4 class="store-title"><i class="fas fa-store me-2 text-secondary"></i>${item['店家名稱']}</h4>
                        
                        <div class="row align-items-center">
                            <!-- 刷這張卡 & 方案 -->
                            <div class="col-12 col-md-6 mb-3 mb-md-0">
                                <div class="info-label">刷卡與方案指南</div>
                                <div class="d-flex align-items-center gap-2 flex-wrap mt-1">
                                    <span class="badge ${cardBadgeColor} fs-6 px-3 py-2 shadow-sm">${item['信用卡']}</span>
                                    <span class="badge scheme-badge fs-6 px-3 py-2 shadow-sm"><i class="fas fa-exchange-alt me-1"></i> 切換：${shortScheme}</span>
                                </div>
                            </div>
                            
                            <!-- 最高回饋 -->
                            <div class="col-6 col-md-3 text-start text-md-center mt-2 mt-md-0">
                                <div class="info-label">最高回饋</div>
                                <div class="reward-rate">${item['回饋比例']}</div>
                            </div>
                            
                            <!-- 規則按鈕 -->
                            <div class="col-6 col-md-3 text-end mt-2 mt-md-0">
                                <button id="${buttonId}" class="btn btn-outline-secondary btn-toggle-rules w-100" onclick="toggleDetails('${buttonId}', '${detailsId}')">
                                    <i class="fas fa-info-circle me-1"></i> 點我看注意事項
                                </button>
                            </div>
                        </div>
                        
                        <!-- 隱藏的注意事項 -->
                        <div id="${detailsId}" class="scheme-details shadow-sm">
                            <strong>📌 詳細方案與條件說明：</strong><br>
                            ${rawSchemeInfo.replace(/\n/g, '<br>')}
                        </div>
                    </div>
                </div>
            `;
            resultsContainer.innerHTML += cardHtml;
        });
    }

    window.onload = fetchAndParseData;
</script>

</body>
</html>
